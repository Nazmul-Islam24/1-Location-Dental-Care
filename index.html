    <script>
      (function () {
        try {
          var currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function () {
              return currentFetch;
            },
            set: function (newFetch) {
              currentFetch = newFetch;
            }
          });
        } catch (e) {}

        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch || protoFetch;
              },
              set: function (newFetch) {
                currentFetch = newFetch;
                protoFetch = newFetch;
              }
            });
          }
        } catch (e) {}
      })();
    </script>
